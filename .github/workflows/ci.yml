name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: ankane/setup-opensearch@v1
        with:
          opensearch-version: 2

      - name: Wait for OpenSearch
        run: timeout 60 bash -c 'until curl -sf http://localhost:9200 > /dev/null; do sleep 2; done'

      - name: Run tests
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: bundle exec rake test
