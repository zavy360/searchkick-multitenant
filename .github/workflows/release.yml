name: Release

# bumps the patch version, builds the gem, and creates a GitHub release with
# the built .gem attached, on every merge to main. The version-bump commit
# includes [skip ci] and this workflow's own trigger is guarded against it,
# so pushing that commit back doesn't cause an infinite loop.
#
# note: this only needs the default GITHUB_TOKEN, but the repo's Settings ->
# Actions -> General -> Workflow permissions must be set to "Read and write
# permissions" for it to push the version bump commit/tag.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Bump patch version
        id: bump
        run: |
          path="lib/searchkick/multi_tenant/version.rb"
          ruby -e '
            path = ARGV[0]
            content = File.read(path)
            content =~ /VERSION = "(\d+)\.(\d+)\.(\d+)"/
            major, minor, patch = $1.to_i, $2.to_i, $3.to_i + 1
            version = "#{major}.#{minor}.#{patch}"
            File.write(path, content.sub(/VERSION = "[\d.]+"/, %(VERSION = "#{version}")))
            File.write(ENV["GITHUB_OUTPUT"], "version=#{version}\n", mode: "a")
          ' "$path"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/searchkick/multi_tenant/version.rb
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Build gem
        run: gem build searchkick-multitenant.gemspec

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            searchkick-multitenant-${{ steps.bump.outputs.version }}.gem \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes
